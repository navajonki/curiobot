name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The action's default package list asks for "tools", which Google removed,
      # so name exactly what this build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Unit tests and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: curiobot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Runs the self-test on a real phone in Firebase Test Lab. Dormant until the
  # repo has the GCP_SA_KEY secret and the TEST_LAB_ENABLED variable set to true.
  # The app's own logs stream to Supabase during the run (event "selftest").
  device-test:
    needs: build
    if: ${{ vars.TEST_LAB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: curiobot-apk
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Game loop on a physical device
        run: |
          gcloud firebase test android run \
            --type game-loop \
            --app app-debug.apk \
            --device "${{ vars.TEST_LAB_DEVICE || 'model=shiba,version=34' }}" \
            --timeout 25m \
            --scenario-numbers 1
